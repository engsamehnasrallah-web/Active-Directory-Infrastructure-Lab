<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5b6b79"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="560" fill="#0f1720"/>

  <text x="450" y="40" text-anchor="middle" fill="#e8edf2" font-size="22" font-weight="600">Active Directory &amp; Windows Server Infrastructure Lab</text>
  <text x="450" y="64" text-anchor="middle" fill="#8fa1b3" font-size="13">Isolated VMware Host-only Network — 192.168.10.0/24</text>

  <!-- Network boundary -->
  <rect x="60" y="100" width="780" height="400" rx="14" fill="none" stroke="#2c3b4a" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="90" y="125" fill="#5b6b79" font-size="13">VMnet2 (Host-only) — 192.168.10.0/24</text>

  <!-- Switch line -->
  <line x1="450" y1="150" x2="450" y2="460" stroke="#3a4b5c" stroke-width="3"/>

  <!-- DC01 -->
  <g>
    <rect x="120" y="160" width="220" height="130" rx="10" fill="#16222d" stroke="#3fa7ff" stroke-width="2"/>
    <text x="230" y="188" text-anchor="middle" fill="#3fa7ff" font-size="16" font-weight="600">DC01</text>
    <text x="230" y="208" text-anchor="middle" fill="#c6d3de" font-size="12">Domain Controller</text>
    <text x="230" y="226" text-anchor="middle" fill="#c6d3de" font-size="12">AD DS · DNS · DHCP</text>
    <text x="230" y="248" text-anchor="middle" fill="#8fa1b3" font-size="12">Static IP: 192.168.10.10</text>
    <text x="230" y="266" text-anchor="middle" fill="#8fa1b3" font-size="12">Domain: adlab.local</text>
    <line x1="340" y1="225" x2="450" y2="225" stroke="#3fa7ff" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- WEB01 -->
  <g>
    <rect x="560" y="160" width="220" height="130" rx="10" fill="#16222d" stroke="#4fd18b" stroke-width="2"/>
    <text x="670" y="188" text-anchor="middle" fill="#4fd18b" font-size="16" font-weight="600">WEB01</text>
    <text x="670" y="208" text-anchor="middle" fill="#c6d3de" font-size="12">Domain-joined Member Server</text>
    <text x="670" y="226" text-anchor="middle" fill="#c6d3de" font-size="12">IIS (IP-restricted)</text>
    <text x="670" y="248" text-anchor="middle" fill="#8fa1b3" font-size="12">Static IP: 192.168.10.11</text>
    <text x="670" y="266" text-anchor="middle" fill="#8fa1b3" font-size="12">DNS: 192.168.10.10</text>
    <line x1="560" y1="225" x2="450" y2="225" stroke="#4fd18b" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- CLIENT01 -->
  <g>
    <rect x="340" y="360" width="220" height="130" rx="10" fill="#16222d" stroke="#f2b134" stroke-width="2"/>
    <text x="450" y="388" text-anchor="middle" fill="#f2b134" font-size="16" font-weight="600">CLIENT01</text>
    <text x="450" y="408" text-anchor="middle" fill="#c6d3de" font-size="12">Domain-joined Windows Client</text>
    <text x="450" y="426" text-anchor="middle" fill="#c6d3de" font-size="12">Sales / IT / HR users</text>
    <text x="450" y="448" text-anchor="middle" fill="#8fa1b3" font-size="12">DHCP: 192.168.10.100–150</text>
    <text x="450" y="466" text-anchor="middle" fill="#8fa1b3" font-size="12">GPO: Sales-Restrict-ControlPanel</text>
    <line x1="450" y1="360" x2="450" y2="300" stroke="#f2b134" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Legend -->
  <text x="90" y="525" fill="#5b6b79" font-size="11">Lines represent logical connectivity over the shared VMnet2 segment (no gateway — isolated network).</text>
  <text x="90" y="543" fill="#5b6b79" font-size="11">Full details: docs/02-network-design.md</text>
</svg>
